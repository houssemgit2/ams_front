<div class="table-responsive">
  <table class="table table-striped table-hover table-bordered">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Logo</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Adresse</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (provider of (listProviders | async) ?? []; track provider.id) {
        <tr>
          <td>{{ provider.id }}</td>
          <td><img src="{{ urlUpload }}/{{ provider.logo }}" style="width: 3rem" /></td>
          <td>{{ provider.name }}</td>
          <td>{{ provider.email }}</td>
          <td>{{ provider.address }}</td>

          <!-- ACTIONS -->
          <td class="text-center">
            <button class="btn btn-sm btn-warning me-2" (click)="openModal(provider)">
              Update
            </button>

            <button class="btn btn-sm btn-danger" (click)="onDelete(provider.id)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted">No providers available</td>
        </tr>
      }
    </tbody>
  </table>

  @if (selectedProvider()) {
    <app-provider-modal
      [provider]="selectedProvider()"
      (close)="closeModal()"
      (update)="handleUpdate($event)"
    ></app-provider-modal>
  }
</div>
