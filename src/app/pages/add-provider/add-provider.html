<div class="container mt-5 d-flex justify-content-center">
  
  <div style="width: 400px;">
    
    <div class="card shadow p-4">
      <h3 class="mb-4 text-center">Add Provider</h3>

      <form #providerForm="ngForm" (ngSubmit)="onSubmit(providerForm)">

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            name="name"
            ngModel
            required
            #name="ngModel"
          />
          @if (name.invalid && name.touched) {
            <div class="text-danger">Name is required</div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            name="email"
            ngModel
            required
            email
            #email="ngModel"
          />
          @if (email.invalid && email.touched) {
            <div class="text-danger">Valid email is required</div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input
            type="text"
            class="form-control"
            name="address"
            ngModel
            required
            #address="ngModel"
          />
          @if (address.invalid && address.touched) {
            <div class="text-danger">Address is required</div>
          }
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="providerForm.invalid"
        >
          Add Provider
        </button>

      </form>
    </div>

  </div>

</div>
